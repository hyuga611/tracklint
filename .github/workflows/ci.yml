name: ci
on:
  push:
  pull_request:

# least privilege: this workflow only needs to read the repo
permissions:
  contents: read

jobs:
  # dogfood: run the published action on the canonical "correct wiring" fixture — must pass (exit 0)
  dogfood:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./
        with:
          files: examples/good

  # regression gate: the "broken wiring" fixture must fail (exit 1) with the expected rule ids
  detects-bad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: examples/bad must fail with expected rules
        run: |
          out="$(node src/check.mjs examples/bad 2>&1)" && { echo "expected non-zero exit"; echo "$out"; exit 1; } || true
          echo "$out"
          echo "$out" | grep -q 'submit-not-button'   || { echo "missing submit-not-button"; exit 1; }
          echo "$out" | grep -q 'ajax-no-conversion' || { echo "missing ajax-no-conversion"; exit 1; }
          echo "$out" | grep -q 'thankyou-indexable'  || { echo "missing thankyou-indexable"; exit 1; }

  test:
    # engines says >=18, and until 2026-08-12 nothing ever ran it: this job pinned
    # Node 20. orogami declared the same floor, was broken on 18, on 20.18 and on
    # 22.0-22.6, and its single Node 20 job stayed green throughout. The break was
    # not monotonic, so one version cannot stand in for the others.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['18.x', '20.x', '22.x', '24.x']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: node --test

  lint:
    # Correctness rules only, no formatter. biome.jsonc records which rules are off
    # and why: each one is a preference this codebase already applies consistently,
    # so enforcing a different one would be churn rather than improvement.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm run lint
